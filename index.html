      }
      compsBox.innerHTML = h;
      focusLeaf();
    }
    document.getElementById('gr-reto').onchange = renderComps;
    renderComps();
  }
  function focusLeaf(){
    if(!focusDocId) return;
    const el = modal.querySelector(`[data-leaf="${focusDocId}"]`);
    if(el){ el.focus(); el.select(); }
  }
  document.getElementById('gr-subject').onchange = renderBody;
  renderBody();
}

/* =========================================================================
   NOTAS VIEW
   ========================================================================= */
function renderNotas(){
  const root=document.getElementById('view-root');
  const stats = SUBJECTS.map(s=>({s, p:subjectLeafProgress(s.key)}));
  const withData = stats.filter(x=>x.p.avg!==null);
  const overallAvg = withData.length? (withData.reduce((a,x)=>a+x.p.avg,0)/withData.length) : null;
  const doneSubjects = stats.filter(x=>x.p.complete).length;

  if(state.notaSubjectSel){
    renderNotaDetail(root, state.notaSubjectSel);
    return;
  }

  root.innerHTML = `
    <div class="notas-summary">
      <div class="stat-tile"><div class="v tnum">${overallAvg!==null?overallAvg.toFixed(2):'—'}</div><div class="l">Media general (de lo evaluado)</div></div>
      <div class="stat-tile"><div class="v tnum">${doneSubjects}/${SUBJECTS.length}</div><div class="l">Asignaturas cerradas</div></div>
      <div class="stat-tile"><div class="v tnum">${withData.length}/${SUBJECTS.length}</div><div class="l">Con notas introducidas</div></div>
    </div>
    <div class="view-toggle-row">
      <div class="seg" id="notas-mode-seg"><button data-m="subject" class="active">Por asignatura</button><button data-m="reto">Por reto</button></div>
    </div>
    <div id="notas-body"></div>
  `;
  document.getElementById('notas-mode-seg').querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{ state.notaViewMode=b.dataset.m; renderNotas(); };
    b.classList.toggle('active', state.notaViewMode===b.dataset.m);
  });
  const bodyEl = document.getElementById('notas-body');
  if(state.notaViewMode==='subject'){
    bodyEl.innerHTML = `<div class="subject-grid">` + stats.map(({s,p})=>{
      const pct = Math.round(p.pctDone*100);
      return `<div class="subj-card" style="--c:${s.color}" data-s="${s.key}">
        <div class="subj-card-name">${s.name}</div>
        <div class="subj-card-grade">${p.avg!==null? p.avg.toFixed(2) : '—'} ${p.avg!==null?'<span class="of10">/10</span>':''}</div>
        <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
        <div class="subj-card-meta"><span>${pct}% evaluado</span>${p.complete?'<span style="color:var(--accent-strong);font-weight:600;">Cerrada ✓</span>':''}</div>
      </div>`;
    }).join('') + `</div>`;
    bodyEl.querySelectorAll('.subj-card').forEach(c=>c.onclick=()=>{ state.notaSubjectSel=c.dataset.s; renderNotas(); });
  } else {
    let html='';
    for(const reto of RETO_ORDER){
      const rows = SUBJECTS.filter(s=>!s.flat && (s.retoWeight[reto]||0)>0).map(s=>{
        const rn = retoNota(s.key,reto);
        return {s,rn};
      });
      if(!rows.length) continue;
      html += `<div class="panel" style="margin-bottom:16px;"><div class="panel-title"><h3>${RETO_LABEL[reto]}</h3></div>`;
      rows.forEach(({s,rn})=>{
        html += `<div class="by-subject-row" style="cursor:pointer;" data-s="${s.key}" data-r="${reto}">
          <span class="legend-dot" style="background:${s.color}"></span>
          <span style="flex:1;">${s.name}</span>
          <span style="font-size:11px;color:var(--text-faint);width:70px;">${Math.round((rn?rn.pct:0)*100)}% evaluado</span>
          <span class="reto-nota tnum" style="color:${s.color}">${rn&&rn.avg!==null? rn.avg.toFixed(2) : '—'}</span>
        </div>`;
      });
      html += `</div>`;
    }
    bodyEl.innerHTML = html;
    bodyEl.querySelectorAll('[data-s]').forEach(el=>el.onclick=()=>{ state.notaSubjectSel=el.dataset.s; renderNotas(); });
  }
}
function renderNotaDetail(root, subjectKey){
  const s = SUBJECTS_BY_KEY[subjectKey];
  const p = subjectLeafProgress(subjectKey);
  root.innerHTML = `
    <button class="btn btn-ghost btn-sm" id="back-notas" style="margin-bottom:16px;">${arrowSvg('left')} Todas las asignaturas</button>
    <div class="panel" style="border-top:4px solid ${s.color};margin-bottom:18px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;">
        <div>
          <div style="font-family:var(--font-display);font-size:22px;font-weight:600;">${s.name}</div>
          <div style="color:var(--text-faint);font-size:12.5px;margin-top:2px;">${Math.round(p.pctDone*100)}% del curso evaluado</div>
        </div>
        <div style="text-align:right;">
          <div class="subj-card-grade tnum" style="color:${s.color};font-size:32px;">${p.avg!==null?p.avg.toFixed(2):'—'}<span class="of10">/10</span></div>
          <div style="font-size:11.5px;color:var(--text-faint);">${p.complete?'Nota final':'Media provisional'}</div>
        </div>
      </div>
      <div class="progress-bar" style="margin-top:14px;"><div class="progress-bar-fill" style="width:${Math.round(p.pctDone*100)}%;background:${s.color}"></div></div>
    </div>
    <div class="panel" style="margin-bottom:18px;">
      <div class="panel-title"><h3>¿Qué necesito sacar?</h3></div>
      <div class="field-row" style="align-items:flex-end;">
        <div class="field" style="margin-bottom:0;"><label>Nota final objetivo</label><input type="number" id="goal-input" min="0" max="10" step="0.1" value="7"></div>
        <button class="btn btn-primary" id="goal-btn">Calcular</button>
      </div>
      <div id="goal-result" style="margin-top:12px;font-size:13.5px;"></div>
    </div>
    <div id="nota-retos"></div>
  `;
  document.getElementById('back-notas').onclick=()=>{ state.notaSubjectSel=null; renderNotas(); };
  document.getElementById('goal-btn').onclick=()=>{
    const target=parseFloat(document.getElementById('goal-input').value);
    const remW = p.weightTotal - p.weightEntered;
    const box=document.getElementById('goal-result');
    if(remW<=0.001){
      box.innerHTML = p.avg>=target? `Ya está todo evaluado y tienes un <b>${p.avg.toFixed(2)}</b> — ${p.avg>=target?'¡objetivo conseguido! 🎉':''}` : `Ya está todo evaluado: tu nota final es <b>${p.avg.toFixed(2)}</b>, no llega a ${target}.`;
      return;
    }
    const needed = (target - p.sumEntered)/remW;
    if(needed>10) box.innerHTML = `No es posible llegar a <b>${target}</b>: necesitarías más de un 10 de media en lo que queda (te falta un ${Math.round(remW*100)}% del curso).`;
    else if(needed<=0) box.innerHTML = `Ya tienes asegurado un <b>${target}</b> pase lo que pase en lo que queda (${Math.round(remW*100)}% del curso).`;
    else box.innerHTML = `Necesitas sacar de media <b style="color:${s.color}">${needed.toFixed(2)}</b> en el ${Math.round(remW*100)}% que te falta por evaluar para acabar con un ${target}.`;
  };
  const retosBox = document.getElementById('nota-retos');
  if(s.flat){
    let h = `<div class="reto-block"><div class="comp-list">`;
    s.flatComponents.forEach(c=>{
      const docId=gradeDocId({subject:subjectKey,reto:'unica',component:c.key,sub:null});
      const g=state.grades[docId];
      h += compRowHtml(c.label, c.weight, g, null, 'unica', c.key);
    });
    h += `</div></div>`;
    retosBox.innerHTML = h;
  } else {
    let h='';
    for(const reto of RETO_ORDER){
      if(!(s.retoWeight[reto]>0)) continue;
      const rn = retoNota(subjectKey,reto);
      h += `<div class="reto-block"><div class="reto-head"><h4>${RETO_LABEL[reto]} <span style="font-weight:400;color:var(--text-faint);font-size:12.5px;">(${Math.round(s.retoWeight[reto]*100)}% de la nota final)</span></h4><span class="reto-nota tnum" style="color:${s.color}">${rn&&rn.avg!==null?rn.avg.toFixed(2):'Sin evaluar'}</span></div><div class="comp-list">`;
      const comps=s.grading[reto]||{};
      for(const comp of ['individual','examen','grupal','entregable']){
        const cw=comps[comp]; if(!cw) continue;
        if(comp==='entregable' && s.entregableBreakdown){
          s.entregableBreakdown.forEach(sub=>{
            const docId=gradeDocId({subject:subjectKey,reto,component:comp,sub:sub.key});
            const g=state.grades[docId];
            const w = cw*sub.weight;
            h += compRowHtml(sub.label, w, g, s.retoWeight[reto]*w, reto, comp+'|'+sub.key);
          });
        } else {
          const docId=gradeDocId({subject:subjectKey,reto,component:comp,sub:null});
          const g=state.grades[docId];
          h += compRowHtml(COMP_LABEL[comp], cw, g, s.retoWeight[reto]*cw, reto, comp);
        }
      }
      h += `</div></div>`;
    }
    retosBox.innerHTML = h;
  }
  // each comp-row carries data-editleaf="reto" so clicking it (or its pencil
  // icon) jumps straight into the grade modal on the right reto — before,
  // rows looked clickable but always reopened the modal on its default reto.
  retosBox.querySelectorAll('[data-editleaf]').forEach(row=>{
    row.onclick=()=>{
      const reto = row.dataset.editleaf;
      const [compKey, subKey] = (row.dataset.comp||'').split('|');
      const docId = compKey? gradeDocId({subject:subjectKey, reto, component:compKey, sub:subKey||null}) : undefined;
      openGradeModal(subjectKey, reto!=='unica'?reto:undefined, docId);
    };
  });
}
function compRowHtml(label,weight,g,finalWeight,reto,comp){
  const hasFinal = typeof finalWeight==='number';
  return `<div class="comp-row" data-editleaf="${reto}" data-comp="${comp}">
    <span class="comp-name">${label}</span>
    <span class="comp-weight tnum">${Math.round(weight*100)}%${hasFinal?' reto':''}</span>
    ${hasFinal?`<span class="comp-final tnum">${Math.round(finalWeight*100)}% nota</span>`:''}
    <span class="comp-val ${g?'':'empty'} tnum">${g?g.value.toFixed(1).replace(/\.0$/,''):'Sin nota'}</span>
    <button type="button" class="comp-edit-btn" title="Editar nota" tabindex="-1">${editSvg()}</button>
  </div>`;
}

/* =========================================================================
   MODAL helper
   ========================================================================= */
function buildModal(title, bodyHtml, actions, deleteAction){
  // NOTE: modals can stack (e.g. "+ Crear categoría nueva" opened from inside
  // the task/event/deliverable modal), so button ids below are only unique
  // *within* this modal's own bg — always look them up scoped via
  // bg.querySelector(...), never document.getElementById(...), otherwise a
  // stacked modal would wire up (and close) the wrong instance.
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML = `<div class="modal">
    <h3>${title}</h3>
    <div id="modal-body">${bodyHtml}</div>
    <div class="modal-actions">
      <div>${deleteAction?`<button class="btn btn-ghost btn-danger-text btn-sm" id="modal-del">${deleteAction.label}</button>`:''}</div>
      <div class="right">
        <button class="btn btn-ghost btn-sm" id="modal-cancel">Cancelar</button>
        ${actions.map((a,i)=>`<button class="btn ${a.primary?'btn-primary':''} btn-sm" id="modal-act-${i}">${a.label}</button>`).join('')}
      </div>
    </div>
  </div>`;
  document.body.appendChild(bg);
  bg.addEventListener('mousedown',e=>{ if(e.target===bg) closeModal(); });
  bg.querySelector('#modal-cancel').onclick=closeModal;
  actions.forEach((a,i)=> bg.querySelector(`#modal-act-${i}`).onclick=a.action );
  if(deleteAction) bg.querySelector('#modal-del').onclick=deleteAction.action;
  return bg;
}
function closeModal(){
  // Close only the topmost modal (last one appended), so stacked modals
  // (e.g. category-creation opened from within another modal) close in the
  // right order instead of yanking the one underneath.
  const modals=document.querySelectorAll('.modal-bg');
  if(modals.length) modals[modals.length-1].remove();
}

/* =========================================================================
   ICS IMPORT FLOW
   ========================================================================= */
document.getElementById('ics-file-input').addEventListener('change', async (e)=>{
  const file=e.target.files[0]; if(!file) return;
  const text=await file.text();
  let parsed;
  try{ parsed = parseICS(text); } catch(err){ toast('No he podido leer ese archivo .ics'); return; }
  if(!parsed.length){ toast('No se han encontrado eventos en ese archivo.'); return; }
  openImportReview(parsed);
  e.target.value='';
});
function openImportReview(parsed){
  const withGuess = parsed.map(ev=>({...ev, categoryKey: guessSubjectForTitle(ev.title)}));
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML = `<div class="modal" style="max-width:640px;">
    <h3>Importar calendario</h3>
    <p style="font-size:13px;color:var(--text-muted);margin-top:-8px;">He encontrado <b>${withGuess.length}</b> eventos. Revisa a qué asignatura pertenece cada uno (he adivinado algunos) y confirma la importación. Los eventos que se repitan cada semana se detectan automáticamente.</p>
    <div id="import-list" style="max-height:44vh;overflow-y:auto;border:1px solid var(--border);border-radius:10px;">
      ${withGuess.map((ev,i)=>`<div style="display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);">
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(ev.title)}</div>
          <div style="font-size:11px;color:var(--text-faint);">${ev.date}${ev.startTime?' · '+ev.startTime:''}${ev.recurrence?' · se repite':''}</div>
        </div>
        <select data-i="${i}" style="width:170px;border:1px solid var(--border);border-radius:8px;padding:5px 7px;background:var(--surface-2);">
          <option value="">Sin categoría</option>
          ${allLabels().map(l=>`<option value="${l.key}" ${ev.categoryKey===l.key?'selected':''}>${l.name}</option>`).join('')}
        </select>
      </div>`).join('')}
    </div>
    <div class="modal-actions"><div></div><div class="right">
      <button class="btn btn-ghost btn-sm" id="modal-cancel">Cancelar</button>
      <button class="btn btn-primary btn-sm" id="import-confirm">Importar ${withGuess.length} eventos</button>
    </div></div>
  </div>`;
  document.body.appendChild(bg);
  bg.addEventListener('mousedown',e=>{ if(e.target===bg) closeModal(); });
  bg.querySelector('#modal-cancel').onclick=closeModal;
  bg.querySelector('#import-confirm').onclick=async ()=>{
    bg.querySelectorAll('#import-list select').forEach(sel=>{ withGuess[+sel.dataset.i].categoryKey = sel.value||null; });
    let count=0;
    for(const ev of withGuess){
      const {source,...rest}=ev;
      const data = {...rest, source:'ics'};
      const id = await dbAdd('events', data);
      if(!db){ state.events.push({id:id||('local'+Date.now()+Math.random()), ...data}); }
      count++;
    }
    closeModal();
    toast(`${count} eventos importados ✓`);
    renderCurrentView();
  };
}

   BOOT
   ========================================================================= */
initDb().then(()=>{ state.loaded=true; renderAll(); });
renderAll();
setInterval(()=>{ if(state.view==='calendar' && state.calMode!=='month') renderCurrentView(); }, 60000);
